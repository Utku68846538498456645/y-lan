<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yılan Oyunu</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1a1a;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 500; }
  #info {
    display: flex;
    justify-content: space-between;
    width: 400px;
    max-width: 90vw;
    font-size: 14px;
    color: #aaa;
  }
  canvas {
    background: #222;
    border-radius: 8px;
    border: 1px solid #444;
    width: 400px;
    height: 400px;
    max-width: 90vw;
    max-height: 90vw;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(2, 48px);
    gap: 6px;
  }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
  }
  button:active { background: #3a3a3a; }
  #restart {
    grid-column: span 3;
    width: 100%;
    height: 40px;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>Yılan Oyunu</h1>
  <div id="info">
    <span>Skor: <b id="score">0</b></span>
    <span id="status">Başlamak için ok tuşuna bas</span>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div class="controls">
    <div></div>
    <button id="up">▲</button>
    <div></div>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
    <button id="restart">Yeniden başlat</button>
  </div>

<script>
(function(){
  const cell = 20, cols = 20, rows = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('status');
  let snake, dir, nextDir, food, score, alive, started, timer;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    alive = true;
    started = false;
    scoreEl.textContent = '0';
    statusEl.textContent = 'Başlamak için ok tuşuna bas';
    placeFood();
    draw();
    clearInterval(timer);
  }

  function placeFood(){
    let ok = false;
    while(!ok){
      food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#e05050';
    ctx.fillRect(food.x*cell+2, food.y*cell+2, cell-4, cell-4);
    snake.forEach((s,i) => {
      ctx.fillStyle = i===0 ? '#4caf7d' : '#2f6b4f';
      ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
    });
  }

  function tick(){
    if(!alive) return;
    dir = nextDir;
    const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
    if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
      alive = false;
      statusEl.textContent = 'Oyun bitti — skor: ' + score;
      clearInterval(timer);
      return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function setDir(x,y){
    if(dir.x===-x && dir.y===-y) return;
    nextDir = {x,y};
    if(!started){
      started = true;
      statusEl.textContent = 'Oynanıyor';
      timer = setInterval(tick, 120);
    }
  }

  document.addEventListener('keydown', (e) => {
    if(e.key==='ArrowUp') { e.preventDefault(); setDir(0,-1); }
    else if(e.key==='ArrowDown') { e.preventDefault(); setDir(0,1); }
    else if(e.key==='ArrowLeft') { e.preventDefault(); setDir(-1,0); }
    else if(e.key==='ArrowRight') { e.preventDefault(); setDir(1,0); }
  });

  document.getElementById('up').onclick = () => setDir(0,-1);
  document.getElementById('down').onclick = () => setDir(0,1);
  document.getElementById('left').onclick = () => setDir(-1,0);
  document.getElementById('right').onclick = () => setDir(1,0);
  document.getElementById('restart').onclick = reset;

  reset();
})();
</script>
</body>
</html>
